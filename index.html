<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Locksmith Exam Trainer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #f3f4f6;
        color: #111827;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      .app {
        min-height: 100vh;
        display: flex;
      }
      aside {
        width: 260px;
        background: #111827;
        color: #e5e7eb;
        padding: 1.25rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .logo {
        font-weight: 700;
        font-size: 1.1rem;
        letter-spacing: 0.03em;
      }
      .topic-list {
        margin-top: 0.5rem;
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        font-size: 0.95rem;
      }
      .topic-list.secondary {
  margin-top: 0.25rem;
  font-size: 0.85rem;
}

      .topic-btn {
        border: none;
        padding: 0.45rem 0.7rem;
        border-radius: 0.5rem;
        background: transparent;
        color: inherit;
        text-align: left;
        cursor: pointer;
        transition: background 0.15s ease, color 0.15s ease;
      }
      .topic-btn:hover {
        background: #1f2937;
      }
      .topic-btn.active {
        background: #f59e0b;
        color: #111827;
        font-weight: 600;
      }
      main {
        flex: 1;
        padding: 1.5rem;
        max-width: 960px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        flex-wrap: wrap;
      }
      .topic-title {
        font-size: 1.2rem;
        font-weight: 600;
        color: #111827;
      }
      .progress {
        font-size: 0.9rem;
        color: #4b5563;
      }
      .card {
        background: #ffffff;
        border-radius: 0.75rem;
        padding: 1.25rem 1.4rem;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      }
      .question-text {
        font-size: 1rem;
        line-height: 1.5;
        margin-bottom: 1rem;
      }
      .options {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .option-item {
        border-radius: 0.6rem;
        border: 1px solid #e5e7eb;
        padding: 0.55rem 0.75rem;
        display: flex;
        align-items: flex-start;
        gap: 0.6rem;
        cursor: pointer;
        transition: border-color 0.12s ease, background 0.12s ease;
      }
      .option-item:hover {
        background: #f9fafb;
        border-color: #d1d5db;
      }
      .option-item.correct {
        border-color: #16a34a;
        background: #f0fdf4;
      }
      .option-item.incorrect {
        border-color: #dc2626;
        background: #fef2f2;
      }
      .option-letter {
        font-weight: 600;
        margin-top: 0.05rem;
        min-width: 1.6rem;
      }
      .option-label {
        flex: 1;
        font-size: 0.98rem;
      }
      .controls {
        margin-top: 1rem;
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
        align-items: center;
      }
      button.primary {
        border: none;
        border-radius: 999px;
        background: #2563eb;
        color: #ffffff;
        padding: 0.5rem 1.3rem;
        font-size: 0.95rem;
        font-weight: 500;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        transition: background 0.15s ease, transform 0.05s ease;
      }
      button.primary:hover {
        background: #1d4ed8;
        transform: translateY(-0.5px);
      }
      button.secondary {
        border-radius: 999px;
        border: 1px solid #d1d5db;
        background: #ffffff;
        color: #111827;
        padding: 0.45rem 1.15rem;
        font-size: 0.9rem;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        transition: background 0.12s ease, border-color 0.12s ease;
      }
      button.secondary:hover {
        background: #f9fafb;
        border-color: #9ca3af;
      }
      .feedback {
        margin-top: 0.6rem;
        font-size: 0.95rem;
        min-height: 1.4rem;
      }
      .feedback.correct {
        color: #15803d;
      }
      .feedback.incorrect {
        color: #b91c1c;
      }
      .score-pill {
        border-radius: 999px;
        padding: 0.15rem 0.75rem;
        background: #e5e7eb;
        font-size: 0.85rem;
        color: #374151;
      }
      @media (max-width: 768px) {
        .app {
          flex-direction: column;
        }
        aside {
          width: 100%;
          flex-direction: row;
          align-items: center;
          gap: 0.75rem;
          overflow-x: auto;
        }
        .topic-list {
          flex-direction: row;
        }
        main {
          padding: 1rem;
        }
        .card {
          padding: 1rem 1.1rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
     <aside>
  <div class="logo">🔐 Locksmith Exam Trainer</div>
  <!-- Верхний ряд: модули (имена файлов) -->
  <div class="topic-list" id="moduleList"></div>
  <!-- Нижний ряд: подтемы внутри выбранного модуля -->
  <div class="topic-list secondary" id="topicList"></div>
</aside>


      <main>
        <div class="top-bar">
          <div class="topic-title" id="topicTitle">Select a topic</div>
          <div class="progress" id="progressText"></div>
        </div>

        <div class="card">
          <div class="question-text" id="questionText">
            Choose a topic on the left to start the quiz.
          </div>
          <ul class="options" id="optionsList"></ul>
          <div class="controls">
            <button class="primary" id="checkBtn" disabled>✅ Check</button>
            <button class="secondary" id="nextBtn" disabled>
              Next question →
            </button>
            <span class="score-pill" id="scoreText"></span>
          </div>
          <div class="feedback" id="feedback"></div>
        </div>
      </main>
    </div>

    <script src="quiz-data.js"></script>
    <script>
  // ===== 2. Состояние =====
  let currentModule = null;
  let currentTopic = null;
  let currentIndex = 0;
  let selectedIndex = null;
  let checked = false;

  const scores = {}; // { module: { topic: {correct,total} } }
  const sessionQuestions = {}; // randomized questions per session

  // ===== 3. DOM =====
  const moduleListEl = document.getElementById("moduleList");
  const topicListEl = document.getElementById("topicList");
  const topicTitleEl = document.getElementById("topicTitle");
  const progressTextEl = document.getElementById("progressText");
  const questionTextEl = document.getElementById("questionText");
  const optionsListEl = document.getElementById("optionsList");
  const checkBtn = document.getElementById("checkBtn");
  const nextBtn = document.getElementById("nextBtn");
  const feedbackEl = document.getElementById("feedback");
  const scoreTextEl = document.getElementById("scoreText");

  // ===== helpers =====
  function shuffleArray(arr) {
    const copy = [...arr];
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  function buildShuffledTopicQuestions(moduleName, topicName) {
    const original = quizTree[moduleName]?.[topicName] || [];
    // Shuffle questions and options so answers aren't locked to the same letter.
    return shuffleArray(original).map((q) => {
      const optionTuples = q.options.map((text, idx) => ({ text, idx }));
      const randomized = shuffleArray(optionTuples);
      const correctIndex = randomized.findIndex((opt) => opt.idx === q.correctIndex);
      return {
        ...q,
        options: randomized.map((opt) => opt.text),
        correctIndex
      };
    });
  }

  // ===== 4. Рендер модулей (файлов) =====
  function renderModules() {
    moduleListEl.innerHTML = "";
    const modules = Object.keys(quizTree);

    modules.forEach((modName, idx) => {
      const btn = document.createElement("button");
      btn.textContent = modName;
      btn.className = "topic-btn" + (idx === 0 ? " active" : "");
      btn.addEventListener("click", () => selectModule(modName));
      moduleListEl.appendChild(btn);
    });

    if (modules.length > 0) {
      selectModule(modules[0]);
    }
  }

  function selectModule(modName) {
    currentModule = modName;
    currentTopic = null;
    currentIndex = 0;
    selectedIndex = null;
    checked = false;

    Array.from(moduleListEl.children).forEach((btn) => {
      btn.classList.toggle("active", btn.textContent === modName);
    });

    renderTopics();
  }

  // ===== 5. Рендер подтем =====
  function renderTopics() {
    topicListEl.innerHTML = "";
    const topicsObj = quizTree[currentModule] || {};
    const topics = Object.keys(topicsObj);

    topicTitleEl.textContent = currentModule;

    if (topics.length === 0) {
      questionTextEl.textContent = "No quizzes for this module yet.";
      optionsListEl.innerHTML = "";
      progressTextEl.textContent = "";
      feedbackEl.textContent = "";
      feedbackEl.className = "feedback";
      scoreTextEl.textContent = "";
      checkBtn.disabled = true;
      nextBtn.disabled = true;
      return;
    }

    topics.forEach((topicName, idx) => {
      const btn = document.createElement("button");
      btn.textContent = topicName;
      btn.className = "topic-btn" + (idx === 0 ? " active" : "");
      btn.addEventListener("click", () => selectTopic(topicName));
      topicListEl.appendChild(btn);
    });

    selectTopic(topics[0]);
  }

  function selectTopic(topicName) {
    currentTopic = topicName;
    currentIndex = 0;
    selectedIndex = null;
    checked = false;

    if (!sessionQuestions[currentModule]) sessionQuestions[currentModule] = {};
    sessionQuestions[currentModule][currentTopic] = buildShuffledTopicQuestions(
      currentModule,
      currentTopic
    );

    Array.from(topicListEl.children).forEach((btn) => {
      btn.classList.toggle("active", btn.textContent === topicName);
    });

    if (!scores[currentModule]) scores[currentModule] = {};
    if (!scores[currentModule][currentTopic])
      scores[currentModule][currentTopic] = { correct: 0, total: 0 };

    renderQuestion();
  }

  // ===== 6. Рендер вопроса =====
  function renderQuestion() {
    const questions = sessionQuestions[currentModule][currentTopic];
    const q = questions[currentIndex];

    topicTitleEl.textContent = currentTopic;
    progressTextEl.textContent = `Question ${currentIndex + 1} of ${questions.length}`;

    questionTextEl.textContent = q.question;
    optionsListEl.innerHTML = "";
    feedbackEl.textContent = "";
    feedbackEl.className = "feedback";
    selectedIndex = null;
    checked = false;

    q.options.forEach((opt, idx) => {
      const li = document.createElement("li");
      li.className = "option-item";

      const radio = document.createElement("input");
      radio.type = "radio";
      radio.name = "option";
      radio.value = idx;
      radio.style.marginTop = "0.2rem";

      radio.addEventListener("change", () => {
        selectedIndex = idx;
        Array.from(optionsListEl.children).forEach((item) =>
          item.classList.remove("selected")
        );
        li.classList.add("selected");
        feedbackEl.textContent = "";
        feedbackEl.className = "feedback";
      });

      const letterSpan = document.createElement("span");
      letterSpan.className = "option-letter";
      letterSpan.textContent = String.fromCharCode(65 + idx) + ")";

      const labelSpan = document.createElement("span");
      labelSpan.className = "option-label";
      labelSpan.textContent = opt;

      li.appendChild(radio);
      li.appendChild(letterSpan);
      li.appendChild(labelSpan);
      optionsListEl.appendChild(li);
    });

    checkBtn.disabled = false;
    nextBtn.disabled = true;
    updateScorePill();
  }

  // ===== 7. Проверка ответа =====
  function checkAnswer() {
    if (selectedIndex === null || checked) return;

    const questions = sessionQuestions[currentModule][currentTopic];
    const q = questions[currentIndex];
    const correctIdx = q.correctIndex;

    const items = Array.from(optionsListEl.children);

    items.forEach((li, idx) => {
      li.classList.remove("correct", "incorrect");
      if (idx === correctIdx) {
        li.classList.add("correct");
      } else if (idx === selectedIndex && idx !== correctIdx) {
        li.classList.add("incorrect");
      }
    });

    const isCorrect = selectedIndex === correctIdx;
    const topicScore = scores[currentModule][currentTopic];

    topicScore.total += 1;
    if (isCorrect) {
      topicScore.correct += 1;
      feedbackEl.textContent = "Correct ✅";
      feedbackEl.className = "feedback correct";
    } else {
      feedbackEl.textContent =
        "Not quite ❌  Correct answer: " +
        String.fromCharCode(65 + correctIdx) +
        ")";
      feedbackEl.className = "feedback incorrect";
    }

    checked = true;
    updateScorePill();
    nextBtn.disabled = currentIndex >= questions.length - 1;
  }

  // ===== 8. Следующий вопрос =====
  function nextQuestion() {
    const questions = sessionQuestions[currentModule][currentTopic];
    if (currentIndex < questions.length - 1) {
      currentIndex += 1;
      renderQuestion();
    }
  }

  // ===== 9. Обновление счёта =====
  function updateScorePill() {
    const moduleScore = scores[currentModule];
    if (!moduleScore || !moduleScore[currentTopic] || moduleScore[currentTopic].total === 0) {
      scoreTextEl.textContent = "";
      return;
    }
    const topicScore = moduleScore[currentTopic];
    const pct = Math.round((topicScore.correct / topicScore.total) * 100);
    scoreTextEl.textContent = `Score for "${currentTopic}": ${topicScore.correct}/${topicScore.total} (${pct}%)`;
  }

  // ===== 10. Слушатели =====
  checkBtn.addEventListener("click", checkAnswer);
  nextBtn.addEventListener("click", nextQuestion);

  // ===== 11. Старт =====
  renderModules();
</script>

  </body>
</html>
